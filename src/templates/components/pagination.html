<% if (total > 1) { %>
<div class="qx-pagination" id="qxPagination">
    <div class="qx-pagination-row">
        <% if (prevUrl) { %>
        <a href="<%= prevUrl %>" class="qx-pagination-nav" data-cursor="PREV" aria-label="上一页"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></a>
        <% } %>
        <%- linksHTML %>
        <% if (nextUrl) { %>
        <a href="<%= nextUrl %>" class="qx-pagination-nav" data-cursor="NEXT" aria-label="下一页"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></a>
        <% } %>
    </div>
</div>
<% } %>
