<section class="qx-page-hero">
    <div class="qx-page-hero-back-wrapper">
        <a href="<%= backUrl || 'javascript:history.back()' %>" class="qx-page-hero-back" data-cursor="BACK">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> <%= backText || '返回上一页' %>
        </a>
    </div>
    <% if (tag) { %>
    <span class="qx-page-hero-tag"><%= tag %></span>
    <% } %>
    <h1 class="qx-page-hero-title" data-roll><%= title %></h1>
    <% if (sub) { %>
    <p class="qx-page-hero-sub"><%= sub %></p>
    <% } %>
</section>
