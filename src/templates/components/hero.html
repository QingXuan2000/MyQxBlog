<section class="s-hero" id="hero" style="<%= heroFit %>">
    <div class="s__waves">
        <svg class="qx-waves-svg js-waves-svg" width="100%" height="100%" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <div class="s__content js-content">
        <%- separator1 %>

        <h1 class="s__title" id="hero-name">
            <span class="s__title__word js-word" data-roll><%= heroTitle %></span>
        </h1>

        <%- separator2 %>
    </div>
</section>

<style>
.s-hero {
  --hero-offset: 56px;
  --title-inset: clamp(1rem, 5vw, 5rem);
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: space-between;
  width: 100%;
  height: calc(100vh - var(--hero-offset));
  height: calc(100svh - var(--hero-offset));
  min-height: 380px;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: var(--bg-body);
  box-sizing: border-box;
}

.s-hero .s__waves {
  --x: -100px;
  --y: -100px;
  position: relative;
  width: 100%;
  height: 100%;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
}

.s-hero .s__waves::before {
  position: absolute;
  top: 0;
  left: 0;
  width: 0.5rem;
  height: 0.5rem;
  background: var(--text-body);
  border-radius: 50%;
  transform: translate3d(calc(var(--x) - 50%), calc(var(--y) - 50%), 0);
  will-change: transform;
  pointer-events: none;
  opacity: 0.8;
  content: '';
}

@media (min-width: 681px) {
  .s-hero .s__waves::before {
    display: none;
  }
}

.qx-waves-svg {
  position: absolute;
  top: 0;
  left: 0;
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.qx-wave-line,
.a__line {
  fill: none;
  stroke: var(--text-body);
  stroke-width: 1px;
  vector-effect: non-scaling-stroke;
}

.s-hero .s__content {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  flex: 0 0 auto;
  background: var(--bg-body);
  overflow: hidden;
}

.s-hero .s__title {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 0;
  margin: 0;
  padding: clamp(0.5rem, 1.4vh, 1.2rem) var(--title-inset);
  border: 0;
  font-family: 'Allegro', var(--font-mono);
  font-weight: 400;
  font-size: min(15vw, var(--hero-fit, 15vw), 15rem);
  line-height: 1.08;
  letter-spacing: 0;
  text-transform: uppercase;
  white-space: nowrap;
  color: var(--text-body);
  user-select: none;
}

.s-hero .s__title::before {
  display: none;
}

.s-hero .s__title__word {
  display: block;
  white-space: nowrap;
  letter-spacing: 1.3vw;
  margin-bottom: -25px;
}

.a-separator {
  position: relative;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  height: 2.25rem;
  padding: 0 1rem;
  overflow: hidden;
  border: 0;
  border-top: 1px solid var(--text-body);
  border-bottom: 1px solid var(--text-body);
  font-family: var(--font-mono, 'JetBrains Mono', Consolas, monospace);
  font-size: 8px;
  line-height: 16px;
  letter-spacing: 0.05em;
  color: var(--text-body);
  box-sizing: border-box;
  user-select: none;
}

.a-separator .a__triangle {
  position: absolute;
  top: 50%;
  width: 0;
  height: 0;
  border-top: 2px solid transparent;
  border-bottom: 2px solid transparent;
  transform: translate3d(0, -50%, 0);
}

.a-separator .a__triangle:first-child {
  left: 1rem;
  border-left: 4px solid var(--text-body);
}

.a-separator .a__triangle:last-child {
  right: 1rem;
  border-right: 4px solid var(--text-body);
}

.a-separator .a__binaries {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 0 0.7rem;
  overflow: hidden;
}

.a-separator .a__code {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  justify-content: flex-start;
  flex: 0 0 auto;
  font-family: inherit;
}

.a-separator .a__char {
  position: relative;
  display: inline-block;
  width: 0.75em;
  overflow: hidden;
  text-align: center;
  font-family: inherit;
  color: var(--text-body);
}

.a-separator .a__char--blank {
  width: 0.5em;
}

.a-separator .a__stripes {
  flex: 1 1 auto;
  height: 8px;
  margin: 0 8px;
  overflow: hidden;
  line-height: 8px;
  color: var(--text-body);
  opacity: 0.62;
  text-shadow: 0 0 1px var(--text-body);
}

.a-separator .a__stripes::before {
  content: '///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////';
  word-break: break-all;
}

@media (max-width: 1200px) {
  .s-hero .s__title {
    font-size: min(15vw, var(--hero-fit, 15vw), 13rem);
  }
}

@media (max-width: 900px) {
  .a-separator .a__code:nth-child(4n + 3) {
    display: none;
  }
}

@media (max-width: 768px) {
  .s-hero {
    min-height: 320px;
  }

  .s-hero .s__title {
    line-height: 1.08;
    padding: clamp(0.5rem, 1.2vh, 0.9rem) var(--title-inset);
    font-size: min(15vw, var(--hero-fit, 15vw), 5.5rem);
  }

  .a-separator {
    height: 1.85rem;
    padding: 0 0.6rem;
    font-size: 7px;
  }

  .a-separator .a__triangle:first-child {
    left: 0.6rem;
  }

  .a-separator .a__triangle:last-child {
    right: 0.6rem;
  }

  .a-separator .a__binaries {
    padding: 0 0.4rem;
  }
}

@media (max-width: 576px) {
  .a-separator .a__code:nth-child(n) {
    display: flex;
  }

  .a-separator .a__code:nth-child(6n + 3),
  .a-separator .a__code:nth-child(6n + 5) {
    display: none;
  }
}

@media (max-height: 560px) and (min-width: 769px) {
  .s-hero {
    height: auto;
    min-height: 340px;
  }

  .s-hero .s__waves {
    min-height: 200px;
  }
}
</style>

<script type="module">
class Grad {
  constructor(x, y, z) {
    this.x = x;
    this.y = y;
    this.z = z;
  }

  dot2(x, y) {
    return this.x * x + this.y * y;
  }
}

class Noise {
  constructor(seed = 0) {
    this.grad3 = [
      new Grad(1, 1, 0),
      new Grad(-1, 1, 0),
      new Grad(1, -1, 0),
      new Grad(-1, -1, 0),
      new Grad(1, 0, 1),
      new Grad(-1, 0, 1),
      new Grad(1, 0, -1),
      new Grad(-1, 0, -1),
      new Grad(0, 1, 1),
      new Grad(0, -1, 1),
      new Grad(0, 1, -1),
      new Grad(0, -1, -1),
    ];

    this.p = [
      151, 160, 137, 91, 90, 15, 131, 13, 201, 95, 96, 53, 194, 233, 7, 225, 140, 36, 103, 30, 69,
      142, 8, 99, 37, 240, 21, 10, 23, 190, 6, 148, 247, 120, 234, 75, 0, 26, 197, 62, 94, 252, 219,
      203, 117, 35, 11, 32, 57, 177, 33, 88, 237, 149, 56, 87, 174, 20, 125, 136, 171, 168, 68, 175,
      74, 165, 71, 134, 139, 48, 27, 166, 77, 146, 158, 231, 83, 111, 229, 122, 60, 211, 133, 230,
      220, 105, 92, 41, 55, 46, 245, 40, 244, 102, 143, 54, 65, 25, 63, 161, 1, 216, 80, 73, 209,
      76, 132, 187, 208, 89, 18, 169, 200, 196, 135, 130, 116, 188, 159, 86, 164, 100, 109, 198,
      173, 186, 3, 64, 52, 217, 226, 250, 124, 123, 5, 202, 38, 147, 118, 126, 255, 82, 85, 212,
      207, 206, 59, 227, 47, 16, 58, 17, 182, 189, 28, 42, 223, 183, 170, 213, 119, 248, 152, 2, 44,
      154, 163, 70, 221, 153, 101, 155, 167, 43, 172, 9, 129, 22, 39, 253, 19, 98, 108, 110, 79,
      113, 224, 232, 178, 185, 112, 104, 218, 246, 97, 228, 251, 34, 242, 193, 238, 210, 144, 12,
      191, 179, 162, 241, 81, 51, 145, 235, 249, 14, 239, 107, 49, 192, 214, 31, 181, 199, 106, 157,
      184, 84, 204, 176, 115, 121, 50, 45, 127, 4, 150, 254, 138, 236, 205, 93, 222, 114, 67, 29,
      24, 72, 243, 141, 128, 195, 78, 66, 215, 61, 156, 180,
    ];

    this.perm = new Array(512);
    this.gradP = new Array(512);

    this.seed(seed);
  }

  seed(seed) {
    if (seed > 0 && seed < 1) seed *= 65536;
    seed = Math.floor(seed);
    if (seed < 256) seed |= seed << 8;

    for (let i = 0; i < 256; i++) {
      let v = i & 1 ? this.p[i] ^ (seed & 255) : this.p[i] ^ ((seed >> 8) & 255);
      this.perm[i] = this.perm[i + 256] = v;
      this.gradP[i] = this.gradP[i + 256] = this.grad3[v % 12];
    }
  }

  fade(t) {
    return t * t * t * (t * (t * 6 - 15) + 10);
  }

  lerp(a, b, t) {
    return (1 - t) * a + t * b;
  }

  perlin2(x, y) {
    let X = Math.floor(x);
    let Y = Math.floor(y);

    x -= X;
    y -= Y;

    X = X & 255;
    Y = Y & 255;

    const n00 = this.gradP[X + this.perm[Y]].dot2(x, y);
    const n01 = this.gradP[X + this.perm[Y + 1]].dot2(x, y - 1);
    const n10 = this.gradP[X + 1 + this.perm[Y]].dot2(x - 1, y);
    const n11 = this.gradP[X + 1 + this.perm[Y + 1]].dot2(x - 1, y - 1);

    const u = this.fade(x);
    return this.lerp(this.lerp(n00, n10, u), this.lerp(n01, n11, u), this.fade(y));
  }
}

export function initWaves(doc = globalThis.document, win = globalThis.window) {
  if (!doc || !win || typeof doc.querySelector !== 'function') return;

  const header = doc.querySelector('.s__waves') || doc.querySelector('.qx-site-intro-header');
  const svg = header?.querySelector('.qx-waves-svg') || header?.querySelector('svg');
  if (!header || !svg) return;

  if (svg.dataset?.wavesInit) return;
  if (svg.dataset) svg.dataset.wavesInit = 'true';
  else svg.setAttribute?.('data-waves-init', 'true');

  const noise = new Noise(Math.random());

  const mouse = {
    x: -200,
    y: -200,
    lx: 0,
    ly: 0,
    sx: -200,
    sy: -200,
    v: 0,
    vs: 0,
    a: 0,
    set: false,
  };

  let lines = [];
  let paths = [];
  let bounding = { left: 0, top: 0, width: 0, height: 0 };
  let isPaused = false;
  let rafId = null;

  const prefersReduced = win.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches;

  function setSize() {
    const rect = header.getBoundingClientRect();
    bounding = {
      left: rect.left,
      top: rect.top + (win.scrollY || 0),
      width: header.clientWidth || 300,
      height: header.clientHeight || 200,
    };
    svg.style.width = `${bounding.width}px`;
    svg.style.height = `${bounding.height}px`;
  }

  function setLines() {
    setSize();
    const { width, height } = bounding;
    if (width <= 0 || height <= 0) return;

    lines = [];
    paths.forEach((p) => p.remove());
    paths = [];

    const xGap = 20;
    const yGap = 32;

    const oWidth = width + 200;
    const oHeight = height + 30;

    const totalLines = Math.ceil(oWidth / xGap);
    const totalPoints = Math.ceil(oHeight / yGap);

    const xStart = (width - xGap * totalLines) / 2;
    const yStart = (height - yGap * totalPoints) / 2;

    for (let i = 0; i <= totalLines; i++) {
      const points = [];
      for (let j = 0; j <= totalPoints; j++) {
        points.push({
          x: xStart + xGap * i,
          y: yStart + yGap * j,
          wave: { x: 0, y: 0 },
          cursor: { x: 0, y: 0, vx: 0, vy: 0 },
        });
      }

      const path = doc.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.classList.add('a__line', 'js-line', 'qx-wave-line');
      svg.appendChild(path);
      paths.push(path);
      lines.push(points);
    }

    if (isPaused) {
      drawLines();
    }
  }

  function movePoints(time) {
    for (let l = 0; l < lines.length; l++) {
      const points = lines[l];
      for (let pIdx = 0; pIdx < points.length; pIdx++) {
        const p = points[pIdx];

        const move =
          noise.perlin2(
            (p.x + time * 0.0125) * 0.002,
            (p.y + time * 0.005) * 0.0015,
          ) * 12;

        p.wave.x = Math.cos(move) * 32;
        p.wave.y = Math.sin(move) * 16;

        const dx = p.x - mouse.sx;
        const dy = p.y - mouse.sy;
        const d = Math.hypot(dx, dy);
        const lRadius = Math.max(175, mouse.vs);

        if (d < lRadius) {
          const s = 1 - d / lRadius;
          const f = Math.cos(d * 0.001) * s;
          p.cursor.vx += Math.cos(mouse.a) * f * lRadius * mouse.vs * 0.00065;
          p.cursor.vy += Math.sin(mouse.a) * f * lRadius * mouse.vs * 0.00065;
        }

        p.cursor.vx += (0 - p.cursor.x) * 0.005;
        p.cursor.vy += (0 - p.cursor.y) * 0.005;
        p.cursor.vx *= 0.925;
        p.cursor.vy *= 0.925;

        p.cursor.x += p.cursor.vx * 2;
        p.cursor.y += p.cursor.vy * 2;

        p.cursor.x = Math.min(100, Math.max(-100, p.cursor.x));
        p.cursor.y = Math.min(100, Math.max(-100, p.cursor.y));
      }
    }
  }

  function moved(point, withCursorForce = true) {
    const coords = {
      x: point.x + point.wave.x + (withCursorForce ? point.cursor.x : 0),
      y: point.y + point.wave.y + (withCursorForce ? point.cursor.y : 0),
    };
    coords.x = Math.round(coords.x * 10) / 10;
    coords.y = Math.round(coords.y * 10) / 10;
    return coords;
  }

  function drawLines() {
    for (let l = 0; l < lines.length; l++) {
      const points = lines[l];
      let p1 = moved(points[0], false);
      let d = `M ${p1.x} ${p1.y}`;

      for (let pIndex = 0; pIndex < points.length; pIndex++) {
        const isLast = pIndex === points.length - 1;
        const pt = moved(points[pIndex], !isLast);
        d += `L ${pt.x} ${pt.y}`;
      }

      if (paths[l]) {
        paths[l].setAttribute('d', d);
      }
    }
  }

  function updateMouse(clientX, clientY) {
    const rect = header.getBoundingClientRect();
    mouse.x = clientX - rect.left;
    mouse.y = clientY - rect.top;

    if (!mouse.set) {
      mouse.sx = mouse.x;
      mouse.sy = mouse.y;
      mouse.lx = mouse.x;
      mouse.ly = mouse.y;
      mouse.set = true;
    }
  }

  function tick(timestamp) {
    if (isPaused) return;

    mouse.sx += (mouse.x - mouse.sx) * 0.1;
    mouse.sy += (mouse.y - mouse.sy) * 0.1;

    const dx = mouse.x - mouse.lx;
    const dy = mouse.y - mouse.ly;
    const dist = Math.hypot(dx, dy);

    mouse.v = dist;
    mouse.vs += (dist - mouse.vs) * 0.1;
    mouse.vs = Math.min(100, mouse.vs);

    mouse.lx = mouse.x;
    mouse.ly = mouse.y;

    mouse.a = Math.atan2(dy, dx);

    header.style.setProperty('--x', `${mouse.sx}px`);
    header.style.setProperty('--y', `${mouse.sy}px`);

    movePoints(timestamp);
    drawLines();

    rafId = requestAnimationFrame(tick);
  }

  const onMouseMove = (e) => updateMouse(e.clientX, e.clientY);
  const onTouchMove = (e) => {
    if (e.touches && e.touches[0]) {
      updateMouse(e.touches[0].clientX, e.touches[0].clientY);
    }
  };

  win.addEventListener('mousemove', onMouseMove, { passive: true });
  win.addEventListener('touchmove', onTouchMove, { passive: true });

  let relayoutRaf = 0;
  const scheduleRelayout = () => {
    if (relayoutRaf) return;
    relayoutRaf = requestAnimationFrame(() => {
      relayoutRaf = 0;
      setLines();
    });
  };

  if (typeof win.ResizeObserver === 'function') {
    new win.ResizeObserver(scheduleRelayout).observe(header);
  }
  win.addEventListener('resize', scheduleRelayout, { passive: true });
  win.addEventListener('orientationchange', scheduleRelayout, { passive: true });

  doc.addEventListener('visibilitychange', () => {
    if (doc.hidden) {
      isPaused = true;
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    } else {
      isPaused = false;
      if (!prefersReduced && !rafId) {
        rafId = requestAnimationFrame(tick);
      }
    }
  });

  if (typeof win.IntersectionObserver === 'function') {
    const observer = new win.IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) {
        if (isPaused) {
          isPaused = false;
          if (!prefersReduced && !rafId) {
            rafId = requestAnimationFrame(tick);
          }
        }
      } else {
        isPaused = true;
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
      }
    });
    observer.observe(header);
  }

  setLines();
  if (!prefersReduced && typeof requestAnimationFrame === 'function') {
    rafId = requestAnimationFrame(tick);
  }
}

export function initSeparators(doc = globalThis.document) {
  if (!doc || typeof doc.querySelectorAll !== 'function') return;
  const chars = doc.querySelectorAll('.js-char');
  if (!chars.length) return;

  if (
    typeof globalThis.matchMedia === 'function' &&
    globalThis.matchMedia('(prefers-reduced-motion: reduce)').matches
  )
    return;

  const TICK_MS = 100;
  const FLIP_CHANCE = 0.12;
  let timer = 0;

  const tick = () => {
    chars.forEach((char) => {
      if (char.classList.contains('a__char--blank') || Math.random() > FLIP_CHANCE) return;
      const isOne = Math.random() > 0.5;
      char.textContent = isOne ? '1' : '0';
      if (isOne) {
        char.classList.remove('a__char--0');
        char.classList.add('a__char--1');
      } else {
        char.classList.remove('a__char--1');
        char.classList.add('a__char--0');
      }
    });
  };

  const start = () => {
    if (timer) return;
    timer = setInterval(tick, TICK_MS);
  };

  const stop = () => {
    clearInterval(timer);
    timer = 0;
  };

  start();

  if (typeof doc.addEventListener === 'function') {
    doc.addEventListener('visibilitychange', () => (doc.hidden ? stop() : start()));
  }
}

if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      initWaves(document, window);
      initSeparators(document);
    });
  } else {
    initWaves(document, window);
    initSeparators(document);
  }
}
</script>
