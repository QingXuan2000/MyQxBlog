<section class="s-hero" id="hero" style="<%= heroFit %>">
    <div class="s__waves">
        <svg class="qx-waves-svg js-waves-svg" width="100%" height="100%" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <div class="s__content js-content">
        <%- separator1 %>

        <h1 class="s__title" id="hero-name">
            <span class="s__title__word js-word" data-roll><%= heroTitle %></span>
        </h1>

        <%- separator2 %>
    </div>
</section>

<style>
.s-hero {
  --hero-offset: 56px;
  --title-inset: clamp(1rem, 5vw, 5rem);
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: space-between;
  width: 100%;
  height: calc(100vh - var(--hero-offset));
  height: calc(100svh - var(--hero-offset));
  min-height: 380px;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: var(--bg-body);
  box-sizing: border-box;
}

.s-hero .s__waves {
  --x: -100px;
  --y: -100px;
  position: relative;
  width: 100%;
  height: 100%;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
}

.s-hero .s__waves::before {
  position: absolute;
  top: 0;
  left: 0;
  width: 0.5rem;
  height: 0.5rem;
  background: var(--text-body);
  border-radius: 50%;
  transform: translate3d(calc(var(--x) - 50%), calc(var(--y) - 50%), 0);
  will-change: transform;
  pointer-events: none;
  opacity: 0.8;
  content: '';
}

@media (min-width: 681px) {
  .s-hero .s__waves::before {
    display: none;
  }
}

.qx-waves-svg {
  position: absolute;
  top: 0;
  left: 0;
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.qx-wave-line,
.a__line {
  fill: none;
  stroke: var(--text-body);
  stroke-width: 1px;
  vector-effect: non-scaling-stroke;
}

.s-hero .s__content {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  flex: 0 0 auto;
  background: var(--bg-body);
  overflow: hidden;
}

.s-hero .s__title {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 0;
  margin: 0;
  padding: clamp(0.5rem, 1.4vh, 1.2rem) var(--title-inset);
  border: 0;
  font-family: 'Allegro', var(--font-mono);
  font-weight: 400;
  font-size: min(15vw, var(--hero-fit, 15vw), 15rem);
  line-height: 1.08;
  letter-spacing: 0;
  text-transform: uppercase;
  white-space: nowrap;
  color: var(--text-body);
  user-select: none;
}

.s-hero .s__title::before {
  display: none;
}

.s-hero .s__title__word {
  display: block;
  white-space: nowrap;
  letter-spacing: 1.3vw;
  margin-bottom: -25px;
}

.a-separator {
  position: relative;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  height: 2.25rem;
  padding: 0 1rem;
  overflow: hidden;
  border: 0;
  border-top: 1px solid var(--text-body);
  border-bottom: 1px solid var(--text-body);
  font-family: var(--font-mono, 'JetBrains Mono', Consolas, monospace);
  font-size: 8px;
  line-height: 16px;
  letter-spacing: 0.05em;
  color: var(--text-body);
  box-sizing: border-box;
  user-select: none;
}

.a-separator .a__triangle {
  position: absolute;
  top: 50%;
  width: 0;
  height: 0;
  border-top: 2px solid transparent;
  border-bottom: 2px solid transparent;
  transform: translate3d(0, -50%, 0);
}

.a-separator .a__triangle:first-child {
  left: 1rem;
  border-left: 4px solid var(--text-body);
}

.a-separator .a__triangle:last-child {
  right: 1rem;
  border-right: 4px solid var(--text-body);
}

.a-separator .a__binaries {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 0 0.7rem;
  overflow: hidden;
}

.a-separator .a__code {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  justify-content: flex-start;
  flex: 0 0 auto;
  font-family: inherit;
}

.a-separator .a__char {
  position: relative;
  display: inline-block;
  width: 0.75em;
  overflow: hidden;
  text-align: center;
  font-family: inherit;
  color: var(--text-body);
}

.a-separator .a__char--blank {
  width: 0.5em;
}

.a-separator .a__stripes {
  flex: 1 1 auto;
  height: 8px;
  margin: 0 8px;
  overflow: hidden;
  line-height: 8px;
  color: var(--text-body);
  opacity: 0.62;
  text-shadow: 0 0 1px var(--text-body);
}

.a-separator .a__stripes::before {
  content: '///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////';
  word-break: break-all;
}

@media (max-width: 1200px) {
  .s-hero .s__title {
    font-size: min(15vw, var(--hero-fit, 15vw), 13rem);
  }
}

@media (max-width: 900px) {
  .a-separator .a__code:nth-child(4n + 3) {
    display: none;
  }
}

@media (max-width: 768px) {
  .s-hero {
    min-height: 320px;
  }

  .s-hero .s__title {
    line-height: 1.15;
    padding: clamp(0.6rem, 1.5vh, 1rem) var(--title-inset);
    font-size: min(13vw, var(--hero-fit, 13vw), 4.5rem);
  }

  .s-hero .s__title__word {
    margin-bottom: 0;
    letter-spacing: clamp(1px, 0.8vw, 4px);
  }

  .a-separator {
    height: 1.85rem;
    padding: 0 0.6rem;
    font-size: 7px;
  }

  .a-separator .a__triangle:first-child {
    left: 0.6rem;
  }

  .a-separator .a__triangle:last-child {
    right: 0.6rem;
  }

  .a-separator .a__binaries {
    padding: 0 0.4rem;
  }
}

@media (max-width: 576px) {
  .s-hero {
    min-height: 280px;
  }

  .s-hero .s__title {
    line-height: 1.2;
    padding: 0.6rem var(--title-inset);
    font-size: min(12vw, var(--hero-fit, 12vw), 3.5rem);
  }

  .s-hero .s__title__word {
    margin-bottom: 0;
    letter-spacing: clamp(1px, 0.5vw, 3px);
  }

  .a-separator .a__code:nth-child(n) {
    display: flex;
  }

  .a-separator .a__code:nth-child(6n + 3),
  .a-separator .a__code:nth-child(6n + 5) {
    display: none;
  }
}

@media (max-height: 560px) and (min-width: 769px) {
  .s-hero {
    height: auto;
    min-height: 340px;
  }

  .s-hero .s__waves {
    min-height: 200px;
  }
}
</style>
