name: Build and deploy QxBlog

on:
  push:
    branches: [main]
  discussion:
    types:
      [
        created,
        edited,
        deleted,
        category_changed,
        answered,
        unanswered,
        labeled,
        unlabeled,
        closed,
        reopened,
      ]
  workflow_dispatch:

concurrency:
  group: qxblog-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Sync Discussions
        if: github.event_name == 'discussion' || github.event_name == 'workflow_dispatch'
        run: npm run sync
        env:
          GH_TOKEN: ${{ github.token }}
          DISCUSSION_ACTION: ${{ github.event.action }}
          DISCUSSION_NUMBER: ${{ github.event.discussion.number }}
      - name: Save synchronized content
        if: github.event_name == 'discussion' || github.event_name == 'workflow_dispatch'
        run: |
          git add -- content/posts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "content: synchronize GitHub Discussions"
            git push
          fi
      - run: npm test
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static site
        run: npm run build -- --base "$PAGES_BASE_PATH"
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
